plugins { id 'com.android.application' }
def keyFile = rootProject.file('key.properties')
def keyProperties = new Properties()
if (keyFile.exists()) keyFile.withInputStream { keyProperties.load(it) }
android {
 namespace 'com.fomopad.app'
 compileSdk 36
 defaultConfig { applicationId 'com.fomopad.app'; minSdk 24; targetSdk 36; versionCode 2; versionName '1.0.1' }
 signingConfigs {
  release {
   if (keyFile.exists()) { storeFile file(keyProperties['storeFile']); storePassword keyProperties['storePassword']; keyAlias keyProperties['keyAlias']; keyPassword keyProperties['keyPassword'] }
   else if (System.getenv('FOMOPAD_STORE_FILE')) { storeFile file(System.getenv('FOMOPAD_STORE_FILE')); storePassword System.getenv('FOMOPAD_STORE_PASSWORD'); keyAlias System.getenv('FOMOPAD_KEY_ALIAS'); keyPassword System.getenv('FOMOPAD_KEY_PASSWORD') }
  }
 }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2' }
